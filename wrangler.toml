name = "axellab-web"
compatibility_date = "2025-01-01"
main = "./worker/oauth.js"

# Deploy only public/ — never the repo root (avoids uploading .git packs >25MiB)
# Worker handles /api/* (Decap GitHub OAuth + AXEL presence); everything else is static assets.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/axel/latest.json", "/axel/latest"]

# AXEL 在线心跳存储（先 wrangler kv namespace create AXEL_PRESENCE，再把 id 填到下面）
# 未填真实 id 时本地 mock 仍可用；部署前务必替换。
[[kv_namespaces]]
binding = "AXEL_PRESENCE"
id = "5b61324d24f24da6919349dba91bba83"
preview_id = "3d170ec0979445a4bb2155c469672846"

# AXEL 序列号在线核验 / 停用名单（wrangler kv namespace create AXEL_LICENSE，把 id 填到下面）
[[kv_namespaces]]
binding = "AXEL_LICENSE"
id = "82998eac3c844fd28ceefffdace10405"
preview_id = "1dde93e19c2b4b89b6cbaf1eaddc7432"

# 可选变量：
#   GITHUB_REPO = "majianglong500-sketch/axellab-web"   # /api/github 代理只放行这个仓库和 /user（默认就是它）
#   GITHUB_OAUTH_SCOPE                                  # 后台登录申请的 GitHub 权限
# 本仓库是公开仓库，所以只申请 public_repo：登录令牌改不了你的私有仓库。
# ⚠ 以后如果把仓库改成私有，要把这里改成 "repo"，否则后台保存会失败。
[vars]
GITHUB_OAUTH_SCOPE = "public_repo"

# Secrets（Dashboard 或 wrangler secret put；勿写入仓库）
# GITHUB_CLIENT_ID
# GITHUB_CLIENT_SECRET
# AXEL_ADMIN_TOKEN
# AXEL_LICENSE_SECRET   （= 软件 scripts/license-secret.local.json 里的 secret，勿公开；只在服务器上用来生成/校验序列号）
# AXEL_LICENSE_SIGN_KEY （1.0.35 起：Ed25519 签名私钥，PKCS8 base64；软件里只带对应公钥。没配置时「免费领号」会报错）
#
# 可选：一个序列号最多绑几台电脑（默认不限）。需要时取消注释：
# AXEL_MAX_MACHINES = "3"     ← 写在上面的 [vars] 里
