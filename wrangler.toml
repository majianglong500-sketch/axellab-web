name = "axellab-web"
compatibility_date = "2025-01-01"
main = "./worker/oauth.js"

# Deploy only public/ — never the repo root (avoids uploading .git packs >25MiB)
# Worker handles /api/* (Decap GitHub OAuth); everything else is static assets.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

# Secrets (set via dashboard or: wrangler secret put GITHUB_CLIENT_ID / GITHUB_CLIENT_SECRET)
# GITHUB_CLIENT_ID
# GITHUB_CLIENT_SECRET
